---
order: 30
description: Stylesheets, module, deferred and async scripts, and preconnect/preload hints, each with when to use it
---
<!-- Open the connection to another origin early, before anything asks for a file from it -->
<link rel="preconnect" href="https://cdn.example.com" crossorigin>

<!-- Fetch a font the page needs at once, before the CSS asks for it (fonts always need crossorigin) -->
<link rel="preload" href="/fonts/body.woff2" as="font" type="font/woff2" crossorigin>

<link rel="stylesheet" href="/css/styles.css">
<!-- Used only for printing, so it doesn't hold up showing the page -->
<link rel="stylesheet" href="/css/print.css" media="print">

<!-- Module scripts wait for the document like defer, and run in order -->
<script type="module" src="/js/main.js"></script>
<!-- Download a module that main.js imports, in parallel instead of after main.js arrives -->
<link rel="modulepreload" href="/js/chart.js">

<!-- A classic script that waits for the document, in order -->
<script defer src="/js/app.js"></script>
<!-- An independent script (analytics, ads): runs whenever it arrives, in no set order -->
<script async src="/js/analytics.js"></script>
