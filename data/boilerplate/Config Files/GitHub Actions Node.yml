---
label: GitHub Actions (Node)
description: A GitHub Actions workflow that installs npm packages, then checks, builds and tests on every push
file: .github/workflows/ci.yml
whole-file: yes
order: 41
section: ci
---
name: CI

on:
    push:
        branches: [main, master]
    pull_request:
    workflow_dispatch:

jobs:
    check:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci
            - run: npm run check --if-present
            - run: npm run build
            - run: npm run test --if-present
